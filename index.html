<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taftalidze Security Hub - UptimeRobot Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --ur-bg: #f4f6f9;
            --ur-card: #ffffff;
            --ur-border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            
            --green-accent: #10b981;
            --green-bg: #ecfdf5;
            --red-accent: #ef4444;
            --red-bg: #fef2f2;
            --blue-accent: #0284c7;
            --blue-bg: #e0f2fe;
            --orange-accent: #f59e0b;
            
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
        }

        body {
            background-color: var(--ur-bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard-wrapper {
            width: 100%;
            max-width: 640px;
            background: var(--ur-card);
            border: 1px solid var(--ur-border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        /* Top Control Bar / Header */
        .system-bar {
            background: #ffffff;
            border-bottom: 1px solid var(--ur-border);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .system-bar h1 {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .latency-indicator {
            font-size: 12px;
            font-family: var(--font-mono);
            background: var(--green-bg);
            color: var(--green-accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .main-content {
            padding: 24px;
        }

        /* Stats Strip */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: var(--ur-card);
            border: 1px solid var(--ur-border);
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }

        .stat-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--blue-accent);
        }

        .stat-box.alerting::before { background: var(--red-accent); }
        .stat-box.healthy::before { background: var(--green-accent); }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            font-family: var(--font-mono);
            margin-top: 6px;
            color: #0f172a;
        }

        /* Matrix Heatmap */
        .heatmap-panel {
            background: #f8fafc;
            border: 1px solid var(--ur-border);
            padding: 16px;
            margin-bottom: 24px;
            border-radius: 8px;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            gap: 6px;
        }

        .matrix-node {
            height: 16px;
            background: #d1fae5;
            border: 1px solid #10b981;
            border-radius: 3px;
            transition: all 0.2s ease;
        }
        .matrix-node.active-pulse {
            background: #f59e0b !important;
            box-shadow: 0 0 10px #f59e0b;
            border-color: #d97706 !important;
            transform: scale(1.1);
        }

        /* Log Streaming Layout */
        .log-list {
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .log-list::-webkit-scrollbar { width: 6px; }
        .log-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .log-card {
            background: #ffffff;
            border: 1px solid var(--ur-border);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            border-left: 4px solid var(--red-accent);
        }

        .log-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-title {
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
        }

        .log-time {
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .distance-badge {
            align-self: flex-start;
            font-size: 11px;
            font-family: var(--font-mono);
            padding: 3px 8px;
            background: var(--blue-bg);
            color: var(--blue-accent);
            border-radius: 4px;
            font-weight: 600;
        }

        /* Action Controls */
        .control-row {
            margin-top: 24px;
        }

        .btn {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.15s ease;
            border: none;
        }

        .btn-secondary {
            background: #f1f5f9;
            border: 1px solid var(--ur-border);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-danger {
            background: var(--red-accent);
            color: #fff;
            width: 100%;
            box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        /* Auth Screen Design */
        .auth-container {
            padding: 36px;
            max-width: 420px;
            width: 100%;
            background: var(--ur-card);
            border: 1px solid var(--ur-border);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .input-wrapper {
            margin-bottom: 18px;
        }

        .input-wrapper label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--ur-border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: var(--blue-accent);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-form" class="auth-container">
        <h1 style="font-size: 15px; color: #0f172a; margin-bottom: 24px; font-weight: 700; display: flex; align-items: center; gap: 8px;">🔒 TAFTALIDZE // SECURE LOGIN</h1>
        <div class="input-wrapper">
            <label>Operator Node Email</label>
            <input type="email" id="email" placeholder="your@e-mail.com">
        </div>
        <div class="input-wrapper">
            <label>Cryptographic Phrase</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button id="auth-submit-btn" class="btn btn-secondary" style="width: 100%; background: #0f172a; color: #fff; border: none;">Initialize System Validation</button>
    </div>

    <div id="dashboard" class="dashboard-wrapper hidden">
        <div class="system-bar">
            <h1>🟢 Taftalidze Security Hub</h1>
            <div class="latency-indicator">● Operational // Live Sync</div>
        </div>

        <div class="main-content">
            <div class="stats-grid">
                <div class="stat-box alerting">
                    <div class="stat-label">Total Alarms</div>
                    <div class="stat-value" style="color: var(--red-accent);" id="total-alarms-count">0</div>
                </div>
                <div class="stat-box healthy">
                    <div class="stat-label">Uptime Metric</div>
                    <div class="stat-value" style="color: var(--green-accent);" id="uptime-metric-value">0.0%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Sys Kernel</div>
                    <div class="stat-value" style="color: var(--blue-accent);">v2.9</div>
                </div>
            </div>

            <div class="heatmap-panel">
                <div class="panel-title" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <div><span style="color: var(--green-accent);">■</span> Spatial Intrusion Density Map</div>
                    <div style="font-size: 10px; color: var(--text-muted); font-family: var(--font-mono);">[0cm ---> 140cm]</div>
                </div>
                <div class="matrix-grid" id="spatial-matrix-grid">
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div>
                </div>
            </div>

            <div class="panel-title" style="margin-left: 2px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <span>📋 Live Telemetry Logs</span>
                <button id="audio-toggle-btn" class="btn btn-secondary" style="padding: 4px 10px; font-size: 10px; border-radius: 4px;">
                    🔈 Audio Disabled
                </button>
            </div>
            
            <div id="log-container" class="log-list"></div>

            <div class="control-row">
                <button id="hardware-restart-btn" class="btn btn-danger">
                    Execute Remote Hardware Reset Sequence
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SUPABASE ACCREDITATION CREDENTIALS ---
        const SUPABASE_PROJECT_ID = "nlnininesnenehyoshjw";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sbmluaW5lc25lbmVoeW9zaGp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NTAwMjUsImV4cCI6MjA5NzQyNjAyNX0.01yLEIL2-IoOV401Tw_7f5jEvoUocTOguQSPYazxVGk";
        
        const _supabase = supabase.createClient(
            `https://${SUPABASE_PROJECT_ID}.supabase.co`, 
            SUPABASE_ANON_KEY
        );

        // --- 2. NATIVE AUDIO SYNTHESIZER ---
        let isAudioMuted = true;

        function playSystemChime() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.type = 'sine'; 
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
                
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);

                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.2);
            } catch (e) {
                console.warn("Synth engine busy:", e.message);
            }
        }

        // --- 3. SECURITY AUTHENTICATION HANDLERS ---
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if(!email || !password) return alert("Please fill credentials.");

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    alert("Authorization Terminated: " + error.message);
                } else {
                    showDashboard();
                }
            } catch(err) {
                alert("Connection handshake failed.");
            }
        }

        function showDashboard() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            fetchLogs();
            subscribeToLiveUpdates();
        }

        // --- 4. DATA RETRIEVAL & RENDERING PIPELINES ---
        async function fetchLogs() {
            try {
                const { data: logs, error, count } = await _supabase
                    .from('logs')
                    .select('*', { count: 'exact' })
                    .order('created_at', { ascending: false })
                    .limit(5);

                if (error) throw error;
                
                document.getElementById('total-alarms-count').innerText = count !== null ? count : 0;
                renderLogs(logs);

                const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
                const { count: dailyLogCount, error: uptimeError } = await _supabase
                    .from('logs')
                    .select('*', { count: 'exact', head: true })
                    .gte('created_at', oneDayAgo);

                if (!uptimeError) {
                    calculateRealUptime(dailyLogCount);
                }

            } catch (err) {
                console.error("Error drawing data panel:", err.message);
            }
        }

        function calculateRealUptime(actualLogsReceived) {
            const expectedLogsPerDay = 288; 
            
            if (actualLogsReceived === 0) {
                document.getElementById('uptime-metric-value').innerText = "0.0%";
                return;
            }

            let uptimePercentage = (actualLogsReceived / expectedLogsPerDay) * 100;
            if (uptimePercentage > 100) uptimePercentage = 100;
            
            const finalUptimeStr = uptimePercentage.toFixed(1) + "%";
            const uptimeElement = document.getElementById('uptime-metric-value');
            
            uptimeElement.innerText = finalUptimeStr;

            const parentBox = uptimeElement.closest('.stat-box');
            if (uptimePercentage < 85) {
                parentBox.classList.remove('healthy');
                parentBox.classList.add('alerting');
                uptimeElement.style.color = "var(--red-accent)";
            } else {
                parentBox.classList.remove('alerting');
                parentBox.classList.add('healthy');
                uptimeElement.style.color = "var(--green-accent)";
            }
        }

        function renderLogs(logs) {
            const container = document.getElementById('log-container');
            if (!logs || logs.length === 0) {
                container.innerHTML = `<p style="color:var(--text-muted); text-align:center; font-size:12px; font-family:var(--font-mono); margin:30px 0;">NO CONSOLE ALARMS DATA FOUND</p>`;
                return;
            }

            container.innerHTML = logs.map(log => {
                const dateObj = new Date(log.created_at);
                const displayDate = dateObj.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
                const displayTime = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                
                const distanceValue = log.distance_cm ? `${log.distance_cm} cm` : 'Null Vector';

                return `
                    <div class="log-card">
                        <div class="log-row-top">
                            <div class="log-title">
                                <span style="color:var(--red-accent);">⚠️ INTRUSION EVENT DETECTED</span>
                            </div>
                            <div class="log-time">${displayDate} @ ${displayTime}</div>
                        </div>
                        <div class="distance-badge">
                            📍 proximity_metric: ${distanceValue}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- 5. AUDIO PERSISTENCE CONTROLLERS ---
        function toggleDashboardAudio() {
            const btn = document.getElementById('audio-toggle-btn');
            
            if (isAudioMuted) {
                playSystemChime();
                isAudioMuted = false;
                btn.innerHTML = "🔊 Audio Active";
                btn.style.borderColor = "var(--green-accent)";
                btn.style.color = "var(--green-accent)";
                btn.style.background = "var(--green-bg)";
            } else {
                isAudioMuted = true;
                btn.innerHTML = "🔈 Audio Disabled";
                btn.style.borderColor = "var(--ur-border)";
                btn.style.color = "var(--text-main)";
                btn.style.background = "#f1f5f9";
            }
        }

        // --- 6. REAL-TIME EVENT SYNCHRONIZATION ---
        function getColumnFromDistance(distCm) {
            if (!distCm || isNaN(distCm)) return 0;
            let col = Math.floor(distCm / 10);
            return Math.min(13, col);
        }

        function pulseNodeByDistance(colIndex) {
            const nodes = document.querySelectorAll('.matrix-node');
            const primaryNode = nodes[colIndex];
            const lowerNode = nodes[colIndex + 14];
            
            if (primaryNode) {
                primaryNode.classList.add('active-pulse');
                setTimeout(() => primaryNode.classList.remove('active-pulse'), 2000);
            }
            if (lowerNode) {
                lowerNode.classList.add('active-pulse');
                setTimeout(() => lowerNode.classList.remove('active-pulse'), 2000);
            }
        }

        function subscribeToLiveUpdates() {
            _supabase
                .channel('schema-db-changes')
                .on(
                    'postgres_changes', 
                    { event: 'INSERT', schema: 'public', table: 'logs' }, 
                    (payload) => {
                        if (!isAudioMuted) playSystemChime();
                        fetchLogs();
                        
                        const targetCol = getColumnFromDistance(payload.new.distance_cm);
                        pulseNodeByDistance(targetCol);
                    }
                )
                .subscribe();
        }

        // --- 7. REMOTE PROTOCOLS ---
        async function triggerRemoteRestart() {
            if (!confirm("Confirm immediate remote firmware hardware execution restart for ESP32?")) return;

            try {
                const { error } = await _supabase
                    .from('commands')
                    .insert([{ command: 'RESTART', processed: false }]);

                if (error) throw error;
                alert("Execution sequence successfully queued into database pipeline.");
            } catch (err) {
                alert("Failed to push instructions line: " + err.message);
            }
        }

        // --- 8. GLOBAL EVENT HOOKS MANAGEMENT ---
        document.addEventListener('DOMContentLoaded', () => {
            _supabase.auth.getSession().then(({ data: { session } }) => {
                if (session) showDashboard();
            });

            document.getElementById('auth-submit-btn').addEventListener('click', login);
            document.getElementById('audio-toggle-btn').addEventListener('click', toggleDashboardAudio);
            document.getElementById('hardware-restart-btn').addEventListener('click', triggerRemoteRestart);

            document.getElementById('password').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') login();
            });
        });
    </script>
</body>
</html>
