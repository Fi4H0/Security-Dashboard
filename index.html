<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taftalidze Security Hub - Cyber Liquid Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* Space Violet & Dark Blue Core */
            --bg-deep: #070614;
            --bg-surface: #0f0c24;
            --surface-card: rgba(22, 18, 52, 0.65);
            --surface-elevated: rgba(33, 27, 76, 0.75);
            
            /* Matrix Green Neon Palette */
            --matrix-green: #00ff66;
            --matrix-glow: rgba(0, 255, 102, 0.25);
            --matrix-dark: #023816;

            /* Space Violet & Cyan Accents */
            --violet-accent: #a855f7;
            --violet-glow: rgba(168, 85, 247, 0.3);
            --blue-accent: #3b82f6;
            --red-accent: #ff2a5f;
            --red-glow: rgba(255, 42, 95, 0.3);

            --border-subtle: rgba(168, 85, 247, 0.18);
            --border-matrix: rgba(0, 255, 102, 0.3);

            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
            --text-matrix: #6ee7b7;

            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(124, 58, 237, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(0, 255, 102, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, transparent 100%);
        }

        .dashboard-wrapper {
            width: 100%;
            max-width: 640px;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(168, 85, 247, 0.1);
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Header Bar */
        .system-bar {
            background: rgba(10, 8, 26, 0.85);
            border-bottom: 1px solid var(--border-subtle);
            padding: 20px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .system-bar h1 {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .system-bar h1::before {
            content: '';
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--matrix-green);
            box-shadow: 0 0 12px var(--matrix-green);
        }

        .latency-indicator {
            font-size: 11px;
            font-family: var(--font-mono);
            background: rgba(0, 255, 102, 0.08);
            color: var(--matrix-green);
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 700;
            border: 1px solid var(--border-matrix);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px var(--matrix-glow);
        }

        .latency-indicator::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--matrix-green);
            animation: matrix-pulse 1.8s infinite ease-in-out;
        }

        @keyframes matrix-pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .main-content {
            padding: 28px;
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            padding: 16px;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-box:hover {
            border-color: var(--violet-accent);
            box-shadow: 0 8px 20px var(--violet-glow);
            transform: translateY(-3px);
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 800;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            font-family: var(--font-mono);
            margin-top: 8px;
        }

        /* Matrix Map Panel */
        .heatmap-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 20px;
            margin-bottom: 24px;
            border-radius: 18px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 14px;
            letter-spacing: 1.2px;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            gap: 6px;
        }

        .matrix-node {
            height: 20px;
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid rgba(0, 255, 102, 0.15);
            border-radius: 6px;
            transition: all 0.4s ease;
        }

        .matrix-node.active-pulse {
            background: var(--matrix-green) !important;
            box-shadow: 0 0 16px var(--matrix-green), 0 0 30px var(--matrix-green);
            border-color: #ffffff !important;
            transform: scale(1.2);
            z-index: 2;
        }

        /* Log Feed */
        .log-list {
            max-height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-list::-webkit-scrollbar { width: 4px; }
        .log-list::-webkit-scrollbar-thumb { background: var(--violet-accent); border-radius: 4px; }

        .log-card {
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-radius: 14px;
            border-left: 4px solid var(--red-accent);
            transition: all 0.3s ease;
        }

        .log-card:hover {
            border-color: var(--violet-accent);
            transform: translateX(4px);
        }

        .log-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-title {
            font-size: 13px;
            font-weight: 700;
        }

        .log-time {
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .distance-badge {
            align-self: flex-start;
            font-size: 11px;
            font-family: var(--font-mono);
            padding: 4px 12px;
            background: rgba(0, 255, 102, 0.1);
            color: var(--matrix-green);
            border-radius: 8px;
            border: 1px solid var(--border-matrix);
            font-weight: 700;
        }

        /* Liquid Button Styling */
        .liquid-btn-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            overflow: hidden;
            border-radius: 14px;
        }

        .btn-liquid {
            position: relative;
            width: 100%;
            padding: 14px 24px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffffff;
            background: linear-gradient(135deg, #4c1d95 0%, #1e1b4b 100%);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            cursor: pointer;
            z-index: 1;
            transition: all 0.4s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .btn-liquid::before {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--matrix-green) 0%, rgba(168, 85, 247, 0.8) 60%, transparent 100%);
            border-radius: 40%;
            transform: translate(-50%, 0) rotate(0deg);
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.3;
            z-index: -1;
        }

        .btn-liquid:hover::before {
            top: -40%;
            transform: translate(-50%, 0) rotate(360deg);
            opacity: 0.85;
        }

        .btn-liquid:hover {
            color: #000000;
            font-weight: 900;
            border-color: var(--matrix-green);
            box-shadow: 0 0 25px var(--matrix-glow), 0 0 10px var(--matrix-green);
        }

        .btn-danger-liquid {
            background: linear-gradient(135deg, #881337 0%, #31121f 100%);
            border-color: rgba(255, 42, 95, 0.4);
            color: var(--red-accent);
        }

        .btn-danger-liquid::before {
            background: radial-gradient(circle, var(--red-accent) 0%, var(--violet-accent) 70%, transparent 100%);
        }

        .btn-danger-liquid:hover {
            color: #ffffff;
            box-shadow: 0 0 30px var(--red-glow);
        }

        .btn-pill {
            width: auto;
            padding: 6px 14px;
            font-size: 10px;
            border-radius: 20px;
        }

        /* Auth Panel */
        .auth-container {
            padding: 40px;
            max-width: 440px;
            width: 100%;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 30px var(--violet-glow);
            backdrop-filter: blur(20px);
        }

        .input-wrapper {
            margin-bottom: 20px;
        }

        .input-wrapper label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--matrix-green);
            box-shadow: 0 0 15px var(--matrix-glow);
            background: var(--surface-elevated);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-form" class="auth-container">
        <h1 style="font-size: 16px; color: var(--text-main); margin-bottom: 28px; font-weight: 800; letter-spacing: 1.5px; text-align: center;">
            🔮 CYBER SPACE ACCESS
        </h1>
        <div class="input-wrapper">
            <label>Operator ID</label>
            <input type="email" id="email" placeholder="operator@space.net">
        </div>
        <div class="input-wrapper">
            <label>Cryptographic Cipher</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button id="auth-submit-btn" class="btn-liquid">INITIALIZE CONSOLE HANDSHAKE</button>
    </div>

    <div id="dashboard" class="dashboard-wrapper hidden">
        <div class="system-bar">
            <h1>TAFTA HQ // LIQUID SECURITY NODE</h1>
            <div class="latency-indicator">LIVE SYNC</div>
        </div>

        <div class="main-content">
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Total Alarms</div>
                    <div class="stat-value" style="color: var(--red-accent);" id="total-alarms-count">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Uptime Metric</div>
                    <div class="stat-value" style="color: var(--matrix-green);" id="uptime-metric-value">0.0%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Sys Kernel</div>
                    <div class="stat-value" style="color: var(--violet-accent);">v3.0</div>
                </div>
            </div>

            <div class="heatmap-panel">
                <div class="panel-title" style="display: flex; justify-space-between; align-items: center; width: 100%;">
                    <div><span style="color: var(--matrix-green);">■</span> Proximity Intrusion Matrix</div>
                    <div style="font-size: 10px; color: var(--text-muted); font-family: var(--font-mono);">[0cm ---> 140cm]</div>
                </div>
                <div class="matrix-grid" id="spatial-matrix-grid">
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div>
                </div>
            </div>

            <div class="panel-title" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <span>📋 Live Spatial Telemetry Stream</span>
                <button id="audio-toggle-btn" class="btn-liquid btn-pill">
                    🔈 Audio Disabled
                </button>
            </div>
            
            <div id="log-container" class="log-list"></div>

            <div style="margin-top: 24px;">
                <button id="hardware-restart-btn" class="btn-liquid btn-danger-liquid">
                    Execute Remote Hardware Reset Sequence
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SUPABASE CREDENTIALS ---
        const SUPABASE_PROJECT_ID = "nlnininesnenehyoshjw";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sbmluaW5lc25lbmVoeW9zaGp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NTAwMjUsImV4cCI6MjA5NzQyNjAyNX0.01yLEIL2-IoOV401Tw_7f5jEvoUocTOguQSPYazxVGk";
        
        const _supabase = supabase.createClient(
            `https://${SUPABASE_PROJECT_ID}.supabase.co`, 
            SUPABASE_ANON_KEY
        );

        // --- 2. SYNTHESIZER ENGINE ---
        let isAudioMuted = true;

        function playSystemChime() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.type = 'sine'; 
                oscillator.frequency.setValueAtTime(987.77, audioCtx.currentTime); // B5 note
                
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.25);

                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.25);
            } catch (e) {
                console.warn("Audio synthesis unavailable:", e.message);
            }
        }

        // --- 3. AUTHENTICATION LOGIC ---
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if(!email || !password) return alert("Credentials required.");

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    alert("Authentication Failure: " + error.message);
                } else {
                    showDashboard();
                }
            } catch(err) {
                alert("Connection failed.");
            }
        }

        function showDashboard() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            fetchLogs();
            subscribeToLiveUpdates();
        }

        // --- 4. DATA PIPELINE ---
        async function fetchLogs() {
            try {
                const { data: logs, error, count } = await _supabase
                    .from('logs')
                    .select('*', { count: 'exact' })
                    .order('created_at', { ascending: false })
                    .limit(5);

                if (error) throw error;
                
                document.getElementById('total-alarms-count').innerText = count !== null ? count : 0;
                renderLogs(logs);

                const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
                const { count: dailyLogCount, error: uptimeError } = await _supabase
                    .from('logs')
                    .select('*', { count: 'exact', head: true })
                    .gte('created_at', oneDayAgo);

                if (!uptimeError) {
                    calculateRealUptime(dailyLogCount);
                }

            } catch (err) {
                console.error("Data pipeline error:", err.message);
            }
        }

        function calculateRealUptime(actualLogsReceived) {
            const expectedLogsPerDay = 288; 
            
            if (actualLogsReceived === 0) {
                document.getElementById('uptime-metric-value').innerText = "0.0%";
                return;
            }

            let uptimePercentage = (actualLogsReceived / expectedLogsPerDay) * 100;
            if (uptimePercentage > 100) uptimePercentage = 100;
            
            const uptimeElem = document.getElementById('uptime-metric-value');
            uptimeElem.innerText = uptimePercentage.toFixed(1) + "%";

            if (uptimePercentage < 85) {
                uptimeElem.style.color = "var(--red-accent)";
            } else {
                uptimeElem.style.color = "var(--matrix-green)";
            }
        }

        function renderLogs(logs) {
            const container = document.getElementById('log-container');
            if (!logs || logs.length === 0) {
                container.innerHTML = `<p style="color:var(--text-muted); text-align:center; font-size:12px; font-family:var(--font-mono); margin:30px 0;">NO TELEMETRY EVENTS RECORDED</p>`;
                return;
            }

            container.innerHTML = logs.map(log => {
                const dateObj = new Date(log.created_at);
                const displayDate = dateObj.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
                const displayTime = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                const distanceValue = log.distance_cm ? `${log.distance_cm} cm` : 'Null Vector';

                return `
                    <div class="log-card">
                        <div class="log-row-top">
                            <div class="log-title">
                                <span style="color:var(--red-accent);">⚠️ INTRUSION DETECTED</span>
                            </div>
                            <div class="log-time">${displayDate} @ ${displayTime}</div>
                        </div>
                        <div class="distance-badge">
                            📍 proximity_metric: ${distanceValue}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- 5. AUDIO INTERACTION ---
        function toggleDashboardAudio() {
            const btn = document.getElementById('audio-toggle-btn');
            
            if (isAudioMuted) {
                playSystemChime();
                isAudioMuted = false;
                btn.innerHTML = "🔊 Audio Active";
                btn.style.color = "#000000";
                btn.style.background = "var(--matrix-green)";
                btn.style.boxShadow = "0 0 15px var(--matrix-glow)";
            } else {
                isAudioMuted = true;
                btn.innerHTML = "i Audio Disabled";
                btn.style.color = "#ffffff";
                btn.style.background = "linear-gradient(135deg, #4c1d95 0%, #1e1b4b 100%)";
                btn.style.boxShadow = "none";
            }
        }

        // --- 6. REAL-TIME EVENT HANDLER ---
        function getColumnFromDistance(distCm) {
            if (!distCm || isNaN(distCm)) return 0;
            let col = Math.floor(distCm / 10);
            return Math.min(13, col);
        }

        function pulseNodeByDistance(colIndex) {
            const nodes = document.querySelectorAll('.matrix-node');
            const primaryNode = nodes[colIndex];
            const lowerNode = nodes[colIndex + 14];
            
            if (primaryNode) {
                primaryNode.classList.add('active-pulse');
                setTimeout(() => primaryNode.classList.remove('active-pulse'), 2000);
            }
            if (lowerNode) {
                lowerNode.classList.add('active-pulse');
                setTimeout(() => lowerNode.classList.remove('active-pulse'), 2000);
            }
        }

        function subscribeToLiveUpdates() {
            _supabase
                .channel('schema-db-changes')
                .on(
                    'postgres_changes', 
                    { event: 'INSERT', schema: 'public', table: 'logs' }, 
                    (payload) => {
                        if (!isAudioMuted) playSystemChime();
                        fetchLogs();
                        
                        const targetCol = getColumnFromDistance(payload.new.distance_cm);
                        pulseNodeByDistance(targetCol);
                    }
                )
                .subscribe();
        }

        // --- 7. REMOTE COMMANDS ---
        async function triggerRemoteRestart() {
            if (!confirm("Confirm execution of remote hardware restart sequence?")) return;

            try {
                const { error } = await _supabase
                    .from('commands')
                    .insert([{ command: 'RESTART', processed: false }]);

                if (error) throw error;
                alert("Restart command successfully dispatched.");
            } catch (err) {
                alert("Dispatch failed: " + err.message);
            }
        }

        // --- 8. INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            _supabase.auth.getSession().then(({ data: { session } }) => {
                if (session) showDashboard();
            });

            document.getElementById('auth-submit-btn').addEventListener('click', login);
            document.getElementById('audio-toggle-btn').addEventListener('click', toggleDashboardAudio);
            document.getElementById('hardware-restart-btn').addEventListener('click', triggerRemoteRestart);

            document.getElementById('password').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') login();
            });
        });
    </script>
</body>
</html>
