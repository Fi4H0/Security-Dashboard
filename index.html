<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taftalidze Security Hub - Cyber Dark Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #07090e;
            --bg-subtle: #0d111a;
            --surface-card: #131b2e;
            --surface-elevated: #1a243d;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(56, 189, 248, 0.25);
            
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --text-dim: #94a3b8;

            /* Neon Accent Palette */
            --cyan-accent: #38bdf8;
            --cyan-glow: rgba(56, 189, 248, 0.15);
            --green-accent: #10b981;
            --green-glow: rgba(16, 185, 129, 0.15);
            --red-accent: #f43f5e;
            --red-glow: rgba(244, 63, 94, 0.15);
            --amber-accent: #fbbf24;
            --amber-glow: rgba(251, 191, 36, 0.2);

            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.05) 0%, transparent 70%),
                radial-gradient(circle at 80% 100%, rgba(16, 185, 129, 0.03) 0%, transparent 50%);
        }

        .dashboard-wrapper {
            width: 100%;
            max-width: 620px;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        /* Header Bar */
        .system-bar {
            background: rgba(13, 17, 26, 0.8);
            border-bottom: 1px solid var(--border-subtle);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .system-bar h1 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .system-bar h1::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--cyan-accent);
            box-shadow: 0 0 10px var(--cyan-accent);
        }

        .latency-indicator {
            font-size: 11px;
            font-family: var(--font-mono);
            background: var(--green-glow);
            color: var(--green-accent);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .latency-indicator::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green-accent);
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .main-content {
            padding: 24px;
        }

        /* Metric Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            padding: 14px 16px;
            border-radius: 12px;
            transition: all 0.2s ease;
            position: relative;
        }

        .stat-box:hover {
            border-color: var(--border-glow);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            font-family: var(--font-mono);
            margin-top: 6px;
        }

        /* Matrix Heatmap Panel */
        .heatmap-panel {
            background: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            padding: 16px;
            margin-bottom: 24px;
            border-radius: 12px;
        }

        .panel-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(14, 1fr);
            gap: 6px;
        }

        .matrix-node {
            height: 18px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .matrix-node.active-pulse {
            background: var(--amber-accent) !important;
            box-shadow: 0 0 14px var(--amber-accent);
            border-color: #ffffff !important;
            transform: scale(1.15);
        }

        /* Log List Stream */
        .log-list {
            max-height: 270px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .log-list::-webkit-scrollbar { width: 4px; }
        .log-list::-webkit-scrollbar-thumb { background: var(--surface-elevated); border-radius: 4px; }

        .log-card {
            background: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-radius: 10px;
            border-left: 3px solid var(--red-accent);
            transition: all 0.2s ease;
        }

        .log-card:hover {
            border-color: rgba(244, 63, 94, 0.4);
            background: var(--surface-elevated);
        }

        .log-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-title {
            font-size: 13px;
            font-weight: 600;
        }

        .log-time {
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .distance-badge {
            align-self: flex-start;
            font-size: 11px;
            font-family: var(--font-mono);
            padding: 3px 10px;
            background: var(--cyan-glow);
            color: var(--cyan-accent);
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-weight: 600;
        }

        /* Controls & Buttons */
        .control-row {
            margin-top: 24px;
        }

        .btn {
            padding: 12px 18px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-secondary {
            background: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border-glow);
        }

        .btn-danger {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.2), rgba(225, 29, 72, 0.3));
            border: 1px solid var(--red-accent);
            color: var(--red-accent);
            width: 100%;
            box-shadow: 0 4px 15px var(--red-glow);
        }

        .btn-danger:hover {
            background: var(--red-accent);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.6);
        }

        /* Auth Panel */
        .auth-container {
            padding: 36px;
            max-width: 420px;
            width: 100%;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .input-wrapper {
            margin-bottom: 18px;
        }

        .input-wrapper label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--cyan-accent);
            box-shadow: 0 0 12px var(--cyan-glow);
            background: var(--surface-elevated);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-form" class="auth-container">
        <h1 style="font-size: 15px; color: var(--text-main); margin-bottom: 24px; font-weight: 700; letter-spacing: 1px;">🔐 CONSOLE ACCESS LOCK</h1>
        <div class="input-wrapper">
            <label>Operator Node Email</label>
            <input type="email" id="email" placeholder="your@e-mail.com">
        </div>
        <div class="input-wrapper">
            <label>Cryptographic Phrase</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button id="auth-submit-btn" class="btn btn-secondary" style="width: 100%; border-color: var(--cyan-accent); color: var(--cyan-accent);">Initialize System Validation</button>
    </div>

    <div id="dashboard" class="dashboard-wrapper hidden">
        <div class="system-bar">
            <h1>TAFTA HQ // SECURITY MONITOR</h1>
            <div class="latency-indicator">LIVE SYNC</div>
        </div>

        <div class="main-content">
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Total Alarms</div>
                    <div class="stat-value" style="color: var(--red-accent);" id="total-alarms-count">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Uptime Metric</div>
                    <div class="stat-value" style="color: var(--green-accent);" id="uptime-metric-value">0.0%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Sys Kernel</div>
                    <div class="stat-value" style="color: var(--cyan-accent);">v2.9</div>
                </div>
            </div>

            <div class="heatmap-panel">
                <div class="panel-title" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <div><span style="color: var(--cyan-accent);">■</span> Spatial Intrusion Density Map</div>
                    <div style="font-size: 10px; color: var(--text-muted); font-family: var(--font-mono);">[0cm ---> 140cm]</div>
                </div>
                <div class="matrix-grid" id="spatial-matrix-grid">
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div><div class="matrix-node"></div><div class="matrix-node"></div>
                    <div class="matrix-node"></div>
                </div>
            </div>

            <div class="panel-title" style="margin-left: 2px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <span>📋 Live Telemetry Logs</span>
                <button id="audio-toggle-btn" class="btn btn-secondary" style="padding: 4px 10px; font-size: 10px;">
                    🔈 Audio Disabled
                </button>
            </div>
            
            <div id="log-container" class="log-list"></div>

            <div class="control-row">
                <button id="hardware-restart-btn" class="btn btn-danger">
                    Execute Remote Hardware Reset Sequence
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SUPABASE ACCREDITATION CREDENTIALS ---
        const SUPABASE_PROJECT_ID = "nlnininesnenehyoshjw";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sbmluaW5lc25lbmVoeW9zaGp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NTAwMjUsImV4cCI6MjA5NzQyNjAyNX0.01yLEIL2-IoOV401Tw_7f5jEvoUocTOguQSPYazxVGk";
        
        const _supabase = supabase.createClient(
            `https://${SUPABASE_PROJECT_ID}.supabase.co`, 
            SUPABASE_ANON_KEY
        );

        // --- 2. NATIVE AUDIO SYNTHESIZER ---
        let isAudioMuted = true;

        function playSystemChime() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.type = 'sine'; 
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
                
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);

                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.2);
            } catch (e) {
                console.warn("Synth engine busy:", e.message);
            }
        }

        // --- 3. SECURITY AUTHENTICATION HANDLERS ---
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if(!email || !password) return alert("Please fill credentials.");

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    alert("Authorization Terminated: " + error.message);
                } else {
                    showDashboard();
                }
            } catch(err) {
                alert("Connection handshake failed.");
            }
        }

        function showDashboard() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            fetchLogs();
            subscribeToLiveUpdates();
        }

        // --- 4. DATA RETRIEVAL & RENDERING PIPELINES ---
        async function fetchLogs() {
            try {
                const { data: logs, error, count } = await _supabase
                    .from('logs')
                    .select('*', { count: 'exact' })
                    .order('created_at', { ascending: false })
                    .limit(5);

                if (error) throw error;
                
                document.getElementById('total-alarms-count').innerText = count !== null ? count : 0;
                renderLogs(logs);

                const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
                const { count: dailyLogCount, error: uptimeError } = await _supabase
                    .from('logs')
                    .select('*', { count: 'exact', head: true })
                    .gte('created_at', oneDayAgo);

                if (!uptimeError) {
                    calculateRealUptime(dailyLogCount);
                }

            } catch (err) {
                console.error("Error drawing data panel:", err.message);
            }
        }

        function calculateRealUptime(actualLogsReceived) {
            const expectedLogsPerDay = 288; 
            
            if (actualLogsReceived === 0) {
                document.getElementById('uptime-metric-value').innerText = "0.0%";
                return;
            }

            let uptimePercentage = (actualLogsReceived / expectedLogsPerDay) * 100;
            if (uptimePercentage > 100) uptimePercentage = 100;
            
            const finalUptimeStr = uptimePercentage.toFixed(1) + "%";
            const uptimeElement = document.getElementById('uptime-metric-value');
            
            uptimeElement.innerText = finalUptimeStr;

            if (uptimePercentage < 85) {
                uptimeElement.style.color = "var(--red-accent)";
            } else {
                uptimeElement.style.color = "var(--green-accent)";
            }
        }

        function renderLogs(logs) {
            const container = document.getElementById('log-container');
            if (!logs || logs.length === 0) {
                container.innerHTML = `<p style="color:var(--text-muted); text-align:center; font-size:12px; font-family:var(--font-mono); margin:30px 0;">NO CONSOLE ALARMS DATA FOUND</p>`;
                return;
            }

            container.innerHTML = logs.map(log => {
                const dateObj = new Date(log.created_at);
                const displayDate = dateObj.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
                const displayTime = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
                
                const distanceValue = log.distance_cm ? `${log.distance_cm} cm` : 'Null Vector';

                return `
                    <div class="log-card">
                        <div class="log-row-top">
                            <div class="log-title">
                                <span style="color:var(--red-accent);">⚠️ INTRUSION EVENT DETECTED</span>
                            </div>
                            <div class="log-time">${displayDate} @ ${displayTime}</div>
                        </div>
                        <div class="distance-badge">
                            📍 proximity_metric: ${distanceValue}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- 5. AUDIO PERSISTENCE CONTROLLERS ---
        function toggleDashboardAudio() {
            const btn = document.getElementById('audio-toggle-btn');
            
            if (isAudioMuted) {
                playSystemChime();
                isAudioMuted = false;
                btn.innerHTML = "🔊 Audio Active";
                btn.style.borderColor = "var(--green-accent)";
                btn.style.color = "var(--green-accent)";
                btn.style.background = "var(--green-glow)";
            } else {
                isAudioMuted = true;
                btn.innerHTML = "🔈 Audio Disabled";
                btn.style.borderColor = "var(--border-subtle)";
                btn.style.color = "var(--text-main)";
                btn.style.background = "var(--surface-elevated)";
            }
        }

        // --- 6. REAL-TIME EVENT SYNCHRONIZATION ---
        function getColumnFromDistance(distCm) {
            if (!distCm || isNaN(distCm)) return 0;
            let col = Math.floor(distCm / 10);
            return Math.min(13, col);
        }

        function pulseNodeByDistance(colIndex) {
            const nodes = document.querySelectorAll('.matrix-node');
            const primaryNode = nodes[colIndex];
            const lowerNode = nodes[colIndex + 14];
            
            if (primaryNode) {
                primaryNode.classList.add('active-pulse');
                setTimeout(() => primaryNode.classList.remove('active-pulse'), 2000);
            }
            if (lowerNode) {
                lowerNode.classList.add('active-pulse');
                setTimeout(() => lowerNode.classList.remove('active-pulse'), 2000);
            }
        }

        function subscribeToLiveUpdates() {
            _supabase
                .channel('schema-db-changes')
                .on(
                    'postgres_changes', 
                    { event: 'INSERT', schema: 'public', table: 'logs' }, 
                    (payload) => {
                        if (!isAudioMuted) playSystemChime();
                        fetchLogs();
                        
                        const targetCol = getColumnFromDistance(payload.new.distance_cm);
                        pulseNodeByDistance(targetCol);
                    }
                )
                .subscribe();
        }

        // --- 7. REMOTE PROTOCOLS ---
        async function triggerRemoteRestart() {
            if (!confirm("Confirm immediate remote firmware hardware execution restart for ESP32?")) return;

            try {
                const { error } = await _supabase
                    .from('commands')
                    .insert([{ command: 'RESTART', processed: false }]);

                if (error) throw error;
                alert("Execution sequence successfully queued into database pipeline.");
            } catch (err) {
                alert("Failed to push instructions line: " + err.message);
            }
        }

        // --- 8. GLOBAL EVENT HOOKS MANAGEMENT ---
        document.addEventListener('DOMContentLoaded', () => {
            _supabase.auth.getSession().then(({ data: { session } }) => {
                if (session) showDashboard();
            });

            document.getElementById('auth-submit-btn').addEventListener('click', login);
            document.getElementById('audio-toggle-btn').addEventListener('click', toggleDashboardAudio);
            document.getElementById('hardware-restart-btn').addEventListener('click', triggerRemoteRestart);

            document.getElementById('password').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') login();
            });
        });
    </script>
</body>
</html>
